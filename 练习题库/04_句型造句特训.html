<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日语句型造句特训器 · 练习题库</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: rgba(59, 130, 246, 0.15);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.18);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.18);
      --warning: #f59e0b;
      --accent: #8b5cf6;
      --kbd-bg: #334155;
      --kbd-text: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --accent: #7c3aed;
      --kbd-bg: #e2e8f0;
      --kbd-text: #334155;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app-container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: var(--shadow);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--primary-light);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-1px);
    }

    .mode-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
    }
    .mode-bar::-webkit-scrollbar { display: none; }

    .mode-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-pill:hover {
      color: var(--text-main);
      border-color: var(--primary);
    }

    .mode-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .stat-value.combo {
      color: #f59e0b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: var(--card-border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .quiz-tags {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .meta-tag {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .tag-category { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .tag-verbtype { background: rgba(139, 92, 246, 0.15); color: var(--accent); }
    .tag-target { background: rgba(245, 158, 11, 0.15); color: var(--warning); font-weight: 800; }

    .shortcut-tip {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    kbd {
      background: var(--kbd-bg);
      color: var(--kbd-text);
      font-family: inherit;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--card-border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .word-hero {
      text-align: center;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .target-prompt {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.5;
    }

    .target-highlight {
      color: #3b82f6;
      font-weight: 800;
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .word-kanji {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.35;
    }

    ruby rt {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .word-meaning {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
      .word-kanji {
        font-size: 2rem;
      }
    }

    .option-btn {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      text-align: left;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .opt-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .opt-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--kbd-bg);
      color: var(--kbd-text);
      font-size: 0.85rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .opt-status-icon {
      font-size: 1.3rem;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s;
    }

    .option-btn.correct {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      color: var(--success) !important;
      animation: popSuccess 0.3s ease;
    }
    .option-btn.correct .opt-status-icon {
      opacity: 1;
      transform: scale(1);
    }

    .option-btn.wrong {
      border-color: var(--danger) !important;
      background: var(--danger-light) !important;
      color: var(--danger) !important;
      animation: shake 0.35s ease;
    }
    .option-btn.wrong .opt-status-icon {
      opacity: 1;
      transform: scale(1);
    }

    @keyframes popSuccess {
      0% { transform: scale(0.97); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .explanation-box {
      display: none;
      background: var(--primary-light);
      border-left: 5px solid var(--primary);
      border-radius: 12px;
      padding: 18px 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .exp-title {
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .exp-content {
      font-size: 0.94rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .exp-trap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.3);
      color: var(--warning);
      font-weight: 600;
      font-size: 0.9rem;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .next-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      transition: all 0.2s;
    }

    .next-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.5);
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.4s ease;
    }

    .result-badge {
      font-size: 4rem;
    }

    .result-title {
      font-size: 2rem;
      font-weight: 900;
    }

    .result-score-box {
      display: flex;
      gap: 20px;
      margin: 10px 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .res-box-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px 28px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .res-box-num {
      font-size: 2rem;
      font-weight: 900;
      color: var(--primary);
    }

    .res-box-lbl {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .mistakes-list {
      text-align: left;
      width: 100%;
      max-width: 650px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mistake-item {
      background: var(--card-bg);
      border-left: 4px solid var(--danger);
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      border-left-width: 4px;
    }
  </style>
</head>
<body data-theme="dark">

  <div class="app-container">
    <header class="top-nav">
      <div class="brand-title">
        <a href="index.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:8px;" title="返回练习题库总入口">
          <span>🎮 练习中心</span>
        </a>
        <span class="brand-badge">第四章 · 句型篇</span>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="icon-btn" title="查看全部章节练习">
          📑 全部章节
        </a>
        <a href="../index.html" class="icon-btn" title="返回语法手册">
          📖 语法手册
        </a>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="切换暗黑/白天模式">
          🌙 暗黑
        </button>
        <button class="icon-btn" onclick="openMistakesModal()" id="mistakesBtn" title="查看错题本">
          📝 错题集 (<span id="mistakeCount">0</span>)
        </button>
      </div>
    </header>

    <nav class="mode-bar">
      <button class="mode-pill active" onclick="selectMode('all20')">🌟 综合实战 (精选20题)</button>
      <button class="mode-pill" onclick="selectMode('allFull')">🔥 终极试炼 (全量题库)</button>
      <button class="mode-pill" onclick="selectMode('giving')">🎁 授受关系名场面 (あげる/くれる/もらう)</button>
      <button class="mode-pill" onclick="selectMode('conditional')">⚖️ 假定与条件四天王 (と/ば/たら/なら)</button>
      <button class="mode-pill" onclick="selectMode('permission')">📋 许可・禁止・义务 (てもいい/てはいけない)</button>
      <button class="mode-pill" onclick="selectMode('state')">⏳ 动作与状态核心 (ている/てある/ておく)</button>
      
    </nav>

    <section class="stats-card">
      <div class="stat-item">
        <div class="stat-label">当前进度</div>
        <div class="stat-value"><span id="currIdx">1</span> / <span id="totalIdx">20</span></div>
      </div>
      <div class="stat-item">
        <div class="stat-label">准确率</div>
        <div class="stat-value" id="accuracyVal">100%</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">连击 Streak</div>
        <div class="stat-value combo" id="comboVal">🔥 0</div>
      </div>
    </section>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="quiz-card" id="quizCard">
      <div class="quiz-meta">
        <div class="quiz-tags">
          <span class="meta-tag tag-category" id="qCategory">专场分类</span>
          <span class="meta-tag tag-verbtype" id="qVerbType">考点属性</span>
          <span class="meta-tag tag-target" id="qTargetForm">【目标形态】</span>
        </div>
        <div class="shortcut-tip">
          <span>键盘快捷键:</span>
          <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> / <kbd>Enter</kbd>
        </div>
      </div>

      <div class="word-hero">
        <div class="target-prompt" id="promptText">
          请选择正确的变形或填空选项：
        </div>
        <div class="word-kanji" id="wordKanji">
          题目载入中...
        </div>
        <div class="word-meaning" id="wordMeaning">
          含义与解析提示
        </div>
      </div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-box" id="explanationBox">
        <div class="exp-title">
          <span id="expResultBadge">💡</span>
          <span id="expTitle">语法原理解析</span>
        </div>
        <div class="exp-content" id="expFormula">
          【变形法则/语法点】：解析内容
        </div>
        <div class="exp-trap" id="expTrap">
          ⚠️ 避坑提醒：易错陷阱说明
        </div>
      </div>

      <div class="quiz-footer">
        <div style="font-size:0.85rem; color:var(--text-muted);" id="statusHint">
          点击选项或按键盘数字键 1 / 2 / 3 / 4 作答
        </div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">
          下一题 <kbd style="background:rgba(255,255,255,0.2); border:none; color:#fff;">Enter ↵</kbd>
        </button>
      </div>
    </main>

    <div class="quiz-card result-screen" id="resultScreen">
      <div class="result-badge" id="resBadge">🏆</div>
      <div class="result-title" id="resTitle">通关完成！达人出炉！</div>
      <div style="color:var(--text-muted); font-size:1.05rem;" id="resSubtitle">
        你已经掌握了本章节的所有核心考点！
      </div>

      <div class="result-score-box">
        <div class="res-box-item">
          <div class="res-box-num" id="resFinalScore">100%</div>
          <div class="res-box-lbl">最终正确率</div>
        </div>
        <div class="res-box-item">
          <div class="res-box-num" id="resMaxCombo">20</div>
          <div class="res-box-lbl">最高连击数</div>
        </div>
        <div class="res-box-item">
          <div class="res-box-num" id="resWrongCount" style="color:var(--danger);">0</div>
          <div class="res-box-lbl">本次错题</div>
        </div>
      </div>

      <div class="result-actions">
        <button class="next-btn" onclick="restartCurrentMode()">
          🔄 再练一次
        </button>
        <button class="icon-btn" onclick="reviewWrongFromEnd()" id="resReviewBtn" style="padding:14px 22px; font-size:1rem;">
          📝 仅重练错题 (<span id="resWrongPill">0</span>)
        </button>
        <a href="index.html" class="icon-btn" style="padding:14px 22px; font-size:1rem; text-decoration:none;">
          📑 选择其他章节
        </a>
      </div>

      <div class="mistakes-list" id="resMistakesList"></div>
    </div>
  </div>

  <script>
    const ALL_QUESTIONS = [
  {
    "id": "sent_1",
    "category": "授受关系",
    "verbType": "我给别人 (送出)",
    "kanjiHtml": "私は友達に本を____ました。",
    "meaning": "我送给朋友一本书",
    "targetForm": "授受动词选择",
    "options": [
      "あげ",
      "くれ",
      "もらい",
      "いただき"
    ],
    "answerIdx": 0,
    "formula": "【我给别人用あげる】：从我方视角向外部人员送出物品，使用 <strong>「あげる」</strong> ➔ 「友達に本を<strong>あげました</strong>」。",
    "trap": "⚠️ 避坑提醒：「くれる」是别人给我！绝对不能说「私は友達にくれました」，这是主客颠倒。"
  },
  {
    "id": "sent_2",
    "category": "授受关系",
    "verbType": "别人给我 (恩惠流入)",
    "kanjiHtml": "田中さんが私に時計を____ました。",
    "meaning": "田中先生送给我一块手表",
    "targetForm": "授受动词选择",
    "options": [
      "くれ",
      "あげ",
      "もらい",
      "やり"
    ],
    "answerIdx": 0,
    "formula": "【别人给我用くれる】：动作发起者是别人，最终受益人是“我或我方人员”，必须用 <strong>「くれる」</strong> ➔ 「田中さんが私に<strong>くれました</strong>」。",
    "trap": "⚠️ 避坑提醒：主语是田中さん，动作目标是私，不能用あげる。"
  },
  {
    "id": "sent_3",
    "category": "授受关系",
    "verbType": "我从别人处获得",

    const CATEGORIES = [{"id": "all20", "label": "🌟 综合实战 (精选20题)", "filterType": "all_limit", "limit": 20}, {"id": "allFull", "label": "🔥 终极试炼 (全量题库)", "filterType": "all"}, {"id": "giving", "label": "🎁 授受关系名场面 (あげる/くれる/もらう)", "filterType": "category", "matchVal": "授受关系"}, {"id": "conditional", "label": "⚖️ 假定与条件四天王 (と/ば/たら/なら)", "filterType": "category", "matchVal": "假定条件"}, {"id": "permission", "label": "📋 许可・禁止・义务 (てもいい/てはいけない)", "filterType": "category", "matchVal": "许可禁止义务"}, {"id": "state", "label": "⏳ 动作与状态核心 (ている/てある/ておく)", "filterType": "category", "matchVal": "动作与状态"}];
    const STORAGE_KEY = "nihongo_sentence_mistakes";

    let currentMode = CATEGORIES[0].id;
    let questionPool = [];
    let currentQIdx = 0;
    let scoreCount = 0;
    let comboCount = 0;
    let maxCombo = 0;
    let sessionWrongList = [];
    let hasAnswered = false;

    function getStoredMistakes() {
      try {
        const d = localStorage.getItem(STORAGE_KEY);
        return d ? JSON.parse(d) : [];
      } catch (e) {
        return [];
      }
    }

    function saveMistakes(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function updateMistakePill() {
      const list = getStoredMistakes();
      document.getElementById('mistakeCount').innerText = list.length;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function selectMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-pill').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.mode-pill')).find(b => b.getAttribute('onclick')?.includes(mode));
      if (activeBtn) activeBtn.classList.add('active');

      buildQuestionPool();
      startQuiz();
    }

    function buildQuestionPool() {
      const catObj = CATEGORIES.find(c => c.id === currentMode);
      if (!catObj) {
        questionPool = shuffle(ALL_QUESTIONS).slice(0, 20);
        return;
      }

      if (catObj.filterType === 'all_limit') {
        questionPool = shuffle(ALL_QUESTIONS).slice(0, catObj.limit || 20);
      } else if (catObj.filterType === 'all') {
        questionPool = shuffle(ALL_QUESTIONS);
      } else if (catObj.filterType === 'category') {
        questionPool = shuffle(ALL_QUESTIONS.filter(q => q.category === catObj.matchVal));
      } else {
        questionPool = shuffle(ALL_QUESTIONS);
      }
    }

    function startQuiz() {
      currentQIdx = 0;
      scoreCount = 0;
      comboCount = 0;
      maxCombo = 0;
      sessionWrongList = [];
      hasAnswered = false;

      document.getElementById('quizCard').style.display = 'flex';
      document.getElementById('resultScreen').style.display = 'none';

      renderCurrentQuestion();
      updateStats();
      updateMistakePill();
    }

    function restartCurrentMode() {
      buildQuestionPool();
      startQuiz();
    }

    function renderCurrentQuestion() {
      hasAnswered = false;
      const q = questionPool[currentQIdx];
      if (!q) {
        showResults();
        return;
      }

      document.getElementById('qCategory').innerText = q.category;
      document.getElementById('qVerbType').innerText = q.verbType || '核心考点';
      document.getElementById('qTargetForm').innerText = '【' + q.targetForm + '】';
      document.getElementById('promptText').innerHTML = q.prompt || '请选择正确的表达或变形：';

      document.getElementById('wordKanji').innerHTML = q.kanjiHtml;
      document.getElementById('wordMeaning').innerText = q.meaning ? '含义：' + q.meaning : '';

      const optionsWithMeta = q.options.map((optText, origIdx) => ({
        text: optText,
        isCorrect: origIdx === q.answerIdx
      }));
      const shuffledOptions = shuffle(optionsWithMeta);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.correct = opt.isCorrect;
        btn.dataset.idx = idx;
        btn.onclick = () => selectOption(btn, opt.isCorrect, q);

        const keyLetter = ['1', '2', '3', '4'][idx];
        btn.innerHTML = `
          <div class="opt-left">
            <span class="opt-key">${keyLetter}</span>
            <span>${opt.text}</span>
          </div>
          <span class="opt-status-icon">${opt.isCorrect ? '✅' : '❌'}</span>
        `;
        grid.appendChild(btn);
      });

      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('statusHint').innerText = '点击选项或按键盘数字键 1 / 2 / 3 / 4 作答';

      updateStats();
    }

    function selectOption(chosenBtn, isCorrect, q) {
      if (hasAnswered) return;
      hasAnswered = true;

      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        chosenBtn.classList.add('correct');
        scoreCount++;
        comboCount++;
        if (comboCount > maxCombo) maxCombo = comboCount;
        document.getElementById('expResultBadge').innerText = '🎉 回答完全正确！';
        document.getElementById('statusHint').innerText = '太棒了！按 Enter 键进入下一题';
      } else {
        chosenBtn.classList.add('wrong');
        comboCount = 0;
        allBtns.forEach(b => {
          if (b.dataset.correct === 'true') {
            b.classList.add('correct');
          }
        });
        document.getElementById('expResultBadge').innerText = '💡 踩坑啦，请看解析！';
        document.getElementById('statusHint').innerText = '已记录至错题集，按 Enter 键进入下一题';

        sessionWrongList.push({
          q: q,
          chosen: chosenBtn.querySelector('span:last-child').innerText
        });

        const stored = getStoredMistakes();
        if (!stored.some(item => item.id === q.id)) {
          stored.push(q);
          saveMistakes(stored);
          updateMistakePill();
        }
      }

      const expBox = document.getElementById('explanationBox');
      document.getElementById('expTitle').innerText = (q.targetForm || '考点') + ' 语法解析';
      document.getElementById('expFormula').innerHTML = q.formula;
      document.getElementById('expTrap').innerHTML = q.trap;
      expBox.style.display = 'block';

      document.getElementById('nextBtn').style.display = 'inline-flex';
      updateStats();
    }

    function nextQuestion() {
      if (!hasAnswered) return;
      currentQIdx++;
      if (currentQIdx >= questionPool.length) {
        showResults();
      } else {
        renderCurrentQuestion();
      }
    }

    function updateStats() {
      document.getElementById('currIdx').innerText = Math.min(currentQIdx + 1, questionPool.length);
      document.getElementById('totalIdx').innerText = questionPool.length;

      const answeredTotal = hasAnswered ? currentQIdx + 1 : currentQIdx;
      const acc = answeredTotal === 0 ? 100 : Math.round((scoreCount / answeredTotal) * 100);
      document.getElementById('accuracyVal').innerText = acc + '%';
      document.getElementById('comboVal').innerText = comboCount > 1 ? `🔥 ${comboCount} 连击` : `🔥 ${comboCount}`;

      const progress = ((currentQIdx) / questionPool.length) * 100;
      document.getElementById('progressBar').style.width = progress + '%';
    }

    function showResults() {
      document.getElementById('quizCard').style.display = 'none';
      const screen = document.getElementById('resultScreen');
      screen.style.display = 'flex';

      const total = questionPool.length;
      const acc = Math.round((scoreCount / total) * 100);

      document.getElementById('resFinalScore').innerText = acc + '%';
      document.getElementById('resMaxCombo').innerText = maxCombo;
      document.getElementById('resWrongCount').innerText = sessionWrongList.length;
      document.getElementById('resWrongPill').innerText = sessionWrongList.length;

      if (acc === 100) {
        document.getElementById('resBadge').innerText = '👑';
        document.getElementById('resTitle').innerText = '不可思议！满分通关！';
        document.getElementById('resSubtitle').innerText = '所有考点与避坑细节你都已融会贯通！';
      } else if (acc >= 85) {
        document.getElementById('resBadge').innerText = '⚔️';
        document.getElementById('resTitle').innerText = '战绩优异！高分达人！';
        document.getElementById('resSubtitle').innerText = '基础与常见变化极其扎实，个别陷阱稍加留心即可满分！';
      } else if (acc >= 60) {
        document.getElementById('resBadge').innerText = '🌱';
        document.getElementById('resTitle').innerText = '初见成效！再接再厉！';
        document.getElementById('resSubtitle').innerText = '建议重点复习本次错题，加深语法规则的记忆。';
      } else {

      }

      const mList = document.getElementById('resMistakesList');
      mList.innerHTML = '';
      if (sessionWrongList.length > 0) {
        mList.innerHTML = '<h3 style="margin-bottom:8px; font-size:1.1rem; color:var(--text-main);">本次错题深度回放：</h3>';

            </div>
            <div style="font-size:0.88rem; color:var(--text-muted); margin-top:4px;">
              ${item.q.formula}
            </div>
          `;
          mList.appendChild(div);
        });
      }
    }

    function reviewWrongFromEnd() {
      if (sessionWrongList.length === 0) {
        alert('本次测试没有错题，太棒了！');

      questionPool = sessionWrongList.map(item => item.q);

      body.setAttribute('data-theme', next);
      const btn = document.getElementById('themeBtn');
      btn.innerText = next === 'dark' ? '🌙 暗黑' : '☀️ 白天';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (hasAnswered) {
          e.preventDefault();
          nextQuestion();
        }
      } else if (['1', '2', '3', '4'].includes(e.key)) {
        if (!hasAnswered) {
          const idx = parseInt(e.key) - 1;
          const btns = document.querySelectorAll('.option-btn');
          if (btns[idx]) btns[idx].click();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      selectMode(CATEGORIES[0].id);
      updateMistakePill();
    });
  </script>
</body>
</html>
